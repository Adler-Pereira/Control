name: Robô semanal (Steam e desafio)

on:
  schedule:
    - cron: '7 11 * * 1'   # toda segunda às 08h07 (Brasília)
  workflow_dispatch:
    inputs:
      parte:
        description: 'O que rodar'
        type: choice
        options: [tudo, steam, desafio]
        default: tudo

jobs:
  semanal:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/semanal.mjs ${{ inputs.parte != 'tudo' && inputs.parte || '' }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          STEAM_API_KEY: ${{ secrets.STEAM_API_KEY }}
