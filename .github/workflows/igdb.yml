name: Importar jogos (IGDB)

on:
  schedule:
    - cron: '41 4 * * *'      # todo dia: amplia o catálogo (+2000 populares) e traz lançamentos
  workflow_dispatch:
    inputs:
      modo:
        description: 'continuo = próximos da lista + lançamentos (o mesmo do automático) | populares = do início | recentes = só lançamentos'
        type: choice
        options: [continuo, populares, recentes]
        default: continuo
      quantidade:
        description: 'Quantos jogos da lista de populares ler nesta execução (máx. 20000)'
        default: '2000'

jobs:
  importar:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/igdb.mjs "${{ inputs.modo || 'continuo' }}" "${{ inputs.quantidade || '2000' }}"
        env:
          IGDB_CLIENT_ID: ${{ secrets.IGDB_CLIENT_ID }}
          IGDB_CLIENT_SECRET: ${{ secrets.IGDB_CLIENT_SECRET }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
