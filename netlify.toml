# Site estático: não há build, o Netlify publica a pasta raiz.
[build]
  publish = "."
  command = "echo 'sem build'"

# Funções no servidor (busca de jogos no IGDB)
[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    # Libera microfone, câmera e compartilhamento de tela para as calls
    Permissions-Policy = "camera=(self), microphone=(self), display-capture=(self)"

# Arquivos internos que não precisam ficar públicos
[[redirects]]
  from = "/scripts/*"
  to = "/404.html"
  status = 404
  force = true
[[redirects]]
  from = "/supabase/*"
  to = "/404.html"
  status = 404
  force = true
[[redirects]]
  from = "/lib/*"
  to = "/404.html"
  status = 404
  force = true
[[redirects]]
  from = "/netlify/*"
  to = "/404.html"
  status = 404
  force = true
[[redirects]]
  from = "/turn-caseiro/*"
  to = "/404.html"
  status = 404
  force = true
[[redirects]]
  from = "/node_modules/*"
  to = "/404.html"
  status = 404
  force = true
[[redirects]]
  from = "/ponte-discord/*"
  to = "/404.html"
  status = 404
  force = true
[[redirects]]
  from = "/tests/*"
  to = "/404.html"
  status = 404
  force = true
[[redirects]]
  from = "/package*"
  to = "/404.html"
  status = 404
  force = true

# Prévia de links para robôs (WhatsApp, Discord...) e SEO
[[redirects]]
  from = "/sitemap.xml"
  to = "/.netlify/functions/sitemap"
  status = 200

# CDN de imagens do Netlify: capas de jogos e imagens enviadas passam por /.netlify/images
# (redimensionadas, em WebP e servidas pelo mesmo domínio do site)
[images]
  remote_images = ["https://images\\.igdb\\.com/.*", "https://i\\.ytimg\\.com/.*", "https://[a-z0-9.-]*steamstatic\\.com/.*", "https://[a-z0-9-]+\\.supabase\\.co/storage/.*"]
