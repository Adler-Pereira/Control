# ===== Control Critic: TURN caseiro (coturn) =====
# 1) Troque TROQUE_POR_UM_SEGREDO_LONGO por uma senha longa e aleatória.
#    A MESMA senha vai na variável TURN_SECRET do Netlify.
# 2) Troque SEU_IP_PUBLICO pelo IP que aparece em https://ifconfig.me
#    (se o seu IP muda, use o DuckDNS e atualize aqui quando mudar).

listening-port=3478
external-ip=SEU_IP_PUBLICO
realm=controlcritic

# Autenticação temporária (o site gera usuário/senha que expiram)
use-auth-secret
static-auth-secret=TROQUE_POR_UM_SEGREDO_LONGO

# Faixa pequena de portas de retransmissão (suficiente para um grupo de amigos)
min-port=49160
max-port=49200

# Limites para não saturar a sua internet
total-quota=20
user-quota=6
bps-capacity=0
stale-nonce=600
max-bps=4000000

# SEGURANÇA: impede que alguém use o seu TURN para acessar aparelhos da sua rede de casa
no-multicast-peers
denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=100.64.0.0-100.127.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=::1
denied-peer-ip=fc00::-fdff:ffff:ffff:ffff:ffff:ffff:ffff:ffff
denied-peer-ip=fe80::-febf:ffff:ffff:ffff:ffff:ffff:ffff:ffff
no-cli
no-tlsv1
no-tlsv1_1
fingerprint
simple-log
